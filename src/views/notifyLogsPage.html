<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知历史 · SubsTracker</title>
  ${themeResources}
  <style>
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
    .filter-grid { display: grid; grid-template-columns: 2fr repeat(4, minmax(0, 1fr)); gap: 12px; padding: 14px; }
    .log-head, .log-row { display: grid; gap: 14px; grid-template-columns: 158px minmax(140px, 1.2fr) 96px 104px 84px minmax(220px, 2fr); align-items: start; }
    .log-head { padding: 11px 18px; color: var(--muted); font-size: 12px; background: var(--card2); border-bottom: 1px solid var(--line); }
    .log-row { padding: 13px 18px; border-top: 1px solid var(--line); font-size: 13px; }
    .log-head + .log-row { border-top: 0; }
    .log-row:hover { background: var(--card2); }
    .log-row.row-failed { box-shadow: inset 3px 0 0 var(--red); }
    .log-row .l-time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
    .log-row .l-sub { font-weight: 600; min-width: 0; word-break: break-word; }
    .log-row .l-detail { min-width: 0; word-break: break-word; line-height: 1.55; }
    .log-row .l-label { display: none; color: var(--muted); font-size: 11.5px; }
    .raw-pre { white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; font-size: 12px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
    .log-row details summary { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .sched-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 11px 18px; border-top: 1px solid var(--line); font-size: 13px; }
    .sched-row:first-child { border-top: 0; }
    .sched-row .t { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
    .sched-row .why { color: var(--muted); font-size: 12px; }
    .tab-pane.hidden { display: none; }
    @media (max-width: 1023px) {
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-grid > :first-child { grid-column: 1 / -1; }
      .log-head { display: none; }
      .log-row { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; grid-template-areas: "sub status" "time channel" "rule rule" "detail detail"; padding: 14px 16px; }
      .log-row .l-time { grid-area: time; } .log-row .l-sub { grid-area: sub; } .log-row .l-rule { grid-area: rule; }
      .log-row .l-channel { grid-area: channel; text-align: right; } .log-row .l-status { grid-area: status; text-align: right; } .log-row .l-detail { grid-area: detail; }
      .log-row .l-label { display: inline; margin-right: 6px; }
    }
    @media (max-width: 340px) { .filter-grid { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <!--ICON_SPRITE-->
  <div id="toast-container" aria-live="polite"></div>
  <!--APP_HEADER:logs-->

  <main class="main">
    <div class="page-head">
      <div>
        <div class="eyebrow">可追溯的提醒记录</div>
        <h1 class="page-title">通知历史</h1>
        <p class="page-sub">每条通知（成功 / 失败）都有记录，保留 30 天；用于自助排查“为什么没收到通知”。</p>
      </div>
      <button id="reloadBtn" type="button" class="btn">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>刷新数据
      </button>
    </div>

    <!-- 概览卡片 -->
    <section id="summary" class="metric-grid" aria-label="概览">
      <div class="card stat">
        <span class="stat-label">总记录</span>
        <strong id="metricTotal" class="stat-value">-</strong>
      </div>
      <div class="card stat">
        <span class="stat-label"><span class="stat-dot" style="background:var(--green)"></span>成功</span>
        <strong id="metricSuccess" class="stat-value" style="color:var(--green)">-</strong>
      </div>
      <div class="card stat">
        <span class="stat-label"><span class="stat-dot" style="background:var(--red)"></span>失败</span>
        <strong id="metricFailed" class="stat-value" style="color:var(--red)">-</strong>
      </div>
      <div class="card stat">
        <span class="stat-label">最近一次发送</span>
        <strong id="metricLatest" class="stat-value" style="font-size:15px;margin-top:14px">-</strong>
      </div>
    </section>

    <!-- 筛选条 -->
    <section class="card filter-grid mb-5" aria-label="筛选">
      <div>
        <label for="filterSubId" class="label">订阅</label>
        <select id="filterSubId">
          <option value="">全部订阅</option>
        </select>
      </div>
      <div>
        <label for="filterChannel" class="label">渠道</label>
        <select id="filterChannel">
          <option value="">全部</option>
          <option value="telegram">Telegram</option>
          <option value="notifyx">NotifyX</option>
          <option value="webhook">Webhook</option>
          <option value="wechatbot">企业微信</option>
          <option value="email">邮件</option>
          <option value="bark">Bark</option>
          <option value="gotify">Gotify</option>
          <option value="ntfy">ntfy</option>
          <option value="serverchan">Server酱</option>
          <option value="pushplus">PushPlus</option>
          <option value="wpush">WPUSH</option>
        </select>
      </div>
      <div>
        <label for="filterStatus" class="label">状态</label>
        <select id="filterStatus">
          <option value="">全部</option>
          <option value="success">成功</option>
          <option value="failed">失败</option>
        </select>
      </div>
      <div>
        <label for="filterSince" class="label">时间范围</label>
        <select id="filterSince">
          <option value="24">最近 24 小时</option>
          <option value="72" selected>最近 3 天</option>
          <option value="168">最近 7 天</option>
          <option value="720">最近 30 天</option>
          <option value="">不限</option>
        </select>
      </div>
      <div>
        <label for="filterLimit" class="label">条数上限</label>
        <select id="filterLimit">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
    </section>

    <div class="seg mb-4" role="tablist" aria-label="日志类型">
      <button type="button" class="on" role="tab" aria-selected="true" data-tab="notify">通知日志</button>
      <button type="button" role="tab" aria-selected="false" data-tab="sched">调度日志（最近 10 次）</button>
    </div>

    <!-- 通知日志 -->
    <section id="tabNotify" class="tab-pane card overflow-hidden" role="tabpanel">
      <div class="log-head" aria-hidden="true">
        <span>时间</span><span>订阅</span><span>规则</span><span>渠道</span><span>状态</span><span>详情</span>
      </div>
      <div id="logsBody">
        <div class="empty">加载中…</div>
      </div>
    </section>

    <!-- 调度日志 -->
    <section id="tabSched" class="tab-pane card overflow-hidden hidden" role="tabpanel">
      <div id="schedLogs"></div>
    </section>
  </main>

  <script src="/js/lib/api-client.js"></script>
  <script>
    /**
     * 通知历史页脚本
     *
     * 数据源：
     *   GET /api/notification-logs?subId=&channel=&status=&since=&limit=
     *   GET /api/scheduler-logs?limit=10
     *   GET /api/config （取 TIMEZONE 用于本地时间显示）
     *   GET /api/subscriptions （映射 subId → 订阅名）
     */
    let userTz = 'UTC';
    let subNameMap = {};

    function fmtTime(iso) {
      try {
        return new Date(iso).toLocaleString('zh-CN', { timeZone: userTz });
      } catch {
        return iso;
      }
    }

    function ruleLabel(ruleId) {
      if (!ruleId || ruleId === 'none' || ruleId === 'null') {
        return '<span class="eyebrow">手动/默认</span>';
      }
      return '<span class="chip" title="' + escapeHtml(ruleId) + '">' + escapeHtml(String(ruleId).slice(0, 8)) + '</span>';
    }

    function statusBadge(s) {
      if (s === 'success') return '<span class="badge badge-ok badge-dot">成功</span>';
      if (s === 'failed')  return '<span class="badge badge-over badge-dot">失败</span>';
      return '<span class="badge">' + escapeHtml(s) + '</span>';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function buildDetail(log) {
      const parts = [];
      if (log.title) parts.push('<div>' + escapeHtml(log.title) + '</div>');
      if (log.error) parts.push('<div class="mt-1" style="color:var(--red)"><b>错误：</b>' + escapeHtml(log.error) + '</div>');
      if (log.raw) {
        const raw = typeof log.raw === 'string' ? log.raw : JSON.stringify(log.raw, null, 2);
        parts.push('<details><summary>展开原始返回</summary><pre class="raw-pre">' + escapeHtml(raw) + '</pre></details>');
      }
      if (log.content) {
        const trimmed = String(log.content).slice(0, 300) + (log.content.length > 300 ? '…' : '');
        parts.push('<details><summary>展开通知正文</summary><pre class="raw-pre">' + escapeHtml(trimmed) + '</pre></details>');
      }
      return parts.length ? parts.join('') : '<span class="eyebrow">无</span>';
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config', { credentials: 'same-origin' });
        const cfg = await res.json();
        if (cfg && cfg.TIMEZONE) userTz = cfg.TIMEZONE;
      } catch (e) { /* ignore */ }
    }

    async function loadSubs() {
      try {
        const res = await fetch('/api/subscriptions', { credentials: 'same-origin' });
        const list = await res.json();
        const select = document.getElementById('filterSubId');
        if (Array.isArray(list)) {
          for (const s of list) {
            subNameMap[s.id] = s.name;
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            select.appendChild(opt);
          }
        }
      } catch (e) { /* ignore */ }
    }

    async function loadSchedLogs() {
      const target = document.getElementById('schedLogs');
      target.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const data = await ApiClient.get('/api/scheduler-logs', { limit: 10 });
        const logs = (data && data.logs) || [];
        if (logs.length === 0) {
          target.innerHTML = '<div class="empty"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>暂无调度记录</div>';
          return;
        }
        target.innerHTML = logs.map(l => {
          const badge = l.status === 'ok' ? '<span class="badge badge-ok badge-dot">成功</span>'
            : (l.status === 'skipped' ? '<span class="badge badge-soon badge-dot">跳过</span>' : '<span class="badge badge-over badge-dot">错误</span>');
          return '<div class="sched-row">'
            + '<span class="t">' + escapeHtml(fmtTime(l.startedAt)) + '</span>'
            + badge
            + '<span>' + escapeHtml(l.timezone) + ' · 本地 <b>' + escapeHtml(l.currentHour) + '</b> 点 · ' + (l.inWindow ? '在发送窗口内' : '不在发送窗口') + '</span>'
            + '<span class="mono">命中 <b>' + escapeHtml(l.matchedCount) + '</b> · 去重 <b>' + escapeHtml(l.dedupedCount) + '</b> · 发送 <b>' + escapeHtml(l.sentCount) + '</b> · 续订 <b>' + escapeHtml(l.autoRenewedCount) + '</b></span>'
            + (l.reason ? '<span class="why">' + escapeHtml(l.reason) + '</span>' : '')
            + '</div>';
        }).join('');
      } catch (err) {
        target.innerHTML = '<div class="empty" style="color:var(--red)">加载失败：' + escapeHtml(err.message) + '</div>';
      }
    }

    async function loadLogs() {
      const subId = document.getElementById('filterSubId').value.trim();
      const channel = document.getElementById('filterChannel').value;
      const status = document.getElementById('filterStatus').value;
      const sinceHours = document.getElementById('filterSince').value;
      const limit = Number(document.getElementById('filterLimit').value) || 100;
      const params = { limit };
      if (subId) params.subId = subId;
      if (channel) params.channel = channel;
      if (status) params.status = status;
      if (sinceHours) {
        params.since = new Date(Date.now() - Number(sinceHours) * 3600 * 1000).toISOString();
      }

      const tbody = document.getElementById('logsBody');
      tbody.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const data = await ApiClient.get('/api/notification-logs', params);
        const logs = (data && data.logs) || [];

        document.getElementById('metricTotal').textContent = logs.length;
        document.getElementById('metricSuccess').textContent = logs.filter(l => l.status === 'success').length;
        document.getElementById('metricFailed').textContent = logs.filter(l => l.status === 'failed').length;
        document.getElementById('metricLatest').textContent = logs.length ? fmtTime(logs[0].timestamp) : '-';

        if (logs.length === 0) {
          tbody.innerHTML = '<div class="empty"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>没有匹配的记录<div class="eyebrow mt-1">试试扩大时间范围或清除筛选</div></div>';
          return;
        }
        tbody.innerHTML = logs.map(l => {
          const subName = subNameMap[l.subId] || l.subId;
          const rowClass = l.status === 'failed' ? 'row-failed' : 'row-success';
          return '<div class="log-row ' + rowClass + '">'
            + '<div class="l-time">' + escapeHtml(fmtTime(l.timestamp)) + '</div>'
            + '<div class="l-sub">' + escapeHtml(subName) + '</div>'
            + '<div class="l-rule"><span class="l-label">规则</span>' + ruleLabel(l.ruleId) + '</div>'
            + '<div class="l-channel">' + escapeHtml(l.channel) + '</div>'
            + '<div class="l-status">' + statusBadge(l.status) + '</div>'
            + '<div class="l-detail">' + buildDetail(l) + '</div>'
            + '</div>';
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<div class="empty" style="color:var(--red)">加载失败：' + escapeHtml(err.message) + '</div>';
      }
    }

    // ─── 事件绑定 ───
    document.getElementById('reloadBtn').addEventListener('click', async () => {
      const btn = document.getElementById('reloadBtn');
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<svg class="icon spin" aria-hidden="true"><use href="#i-loader"/></svg>刷新中';
      try {
        await Promise.all([loadLogs(), loadSchedLogs()]);
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });
    ['filterSubId', 'filterChannel', 'filterStatus', 'filterSince', 'filterLimit'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', loadLogs);
    });

    // ─── 实时时钟（与其他 admin 页一致的实现）───
    function formatTimezoneDisplay(tz) {
      try {
        const now = new Date();
        const dtf = new Intl.DateTimeFormat('en-US', {
          timeZone: tz, hour12: false,
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        const parts = dtf.formatToParts(now);
        const get = (type) => Number(parts.find(x => x.type === type).value);
        const target = Date.UTC(get('year'), get('month') - 1, get('day'), get('hour'), get('minute'), get('second'));
        const offset = Math.round((target - now.getTime()) / (1000 * 60 * 60));
        const offsetStr = offset >= 0 ? '+' + offset : offset;
        const names = {
          'UTC': '世界标准时间',
          'Asia/Shanghai': '中国标准时间',
          'Asia/Hong_Kong': '香港时间',
          'Asia/Taipei': '台北时间',
          'Asia/Singapore': '新加坡时间',
          'Asia/Tokyo': '日本时间',
          'Asia/Seoul': '韩国时间',
          'America/New_York': '美国东部时间',
          'America/Los_Angeles': '美国太平洋时间',
          'America/Chicago': '美国中部时间',
          'America/Denver': '美国山地时间',
          'Europe/London': '英国时间',
          'Europe/Paris': '巴黎时间',
          'Europe/Berlin': '柏林时间',
          'Europe/Moscow': '莫斯科时间',
          'Australia/Sydney': '悉尼时间',
          'Australia/Melbourne': '墨尔本时间',
          'Pacific/Auckland': '奥克兰时间'
        };
        const cn = names[tz] || tz;
        return cn + ' (UTC' + offsetStr + ')';
      } catch { return tz; }
    }

    function startClock() {
      const updateClock = () => {
        try {
          const now = new Date();
          const timeStr = now.toLocaleString('zh-CN', {
            timeZone: userTz,
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          });
          const tzStr = formatTimezoneDisplay(userTz);
          const el = document.getElementById('systemTimeDisplay');
          const mob = document.getElementById('mobileTimeDisplay');
          if (el) el.textContent = timeStr + '  ' + tzStr;
          if (mob) mob.textContent = timeStr + ' ' + tzStr;
        } catch { /* ignore */ }
      };
      updateClock();
      setInterval(updateClock, 1000);
    }

    // ─── 通知日志 / 调度日志 切换 ───
    function setupTabs() {
      const buttons = document.querySelectorAll('[data-tab]');
      buttons.forEach(btn => btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        buttons.forEach(b => {
          const on = b === btn;
          b.classList.toggle('on', on);
          b.setAttribute('aria-selected', String(on));
        });
        document.getElementById('tabNotify').classList.toggle('hidden', tab !== 'notify');
        document.getElementById('tabSched').classList.toggle('hidden', tab !== 'sched');
      }));
    }

    // ─── 启动 ───
    (async function init() {
      setupTabs();
      await loadConfig();
      startClock();
      await loadSubs();
      await Promise.all([loadLogs(), loadSchedLogs()]);
    })();
  </script>
</body>
</html>
