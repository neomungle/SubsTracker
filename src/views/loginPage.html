<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · SubsTracker</title>
  ${themeResources}
  <style>
    .login-bg { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(circle at 18% 8%, color-mix(in srgb, var(--card) 90%, transparent) 0, transparent 34%),
                  radial-gradient(circle at 85% 90%, color-mix(in srgb, var(--brand-amber) 10%, transparent) 0, transparent 30%),
                  linear-gradient(135deg, var(--paper), color-mix(in srgb, var(--paper) 88%, var(--muted))); }
    .login-card { width: min(420px, 100%); padding: 34px 32px 28px; }
    .login-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; margin-bottom: 28px; }
    .login-brand .brand-mark { width: 52px; height: 52px; }
    .login-brand .wordmark { font-size: 22px; font-weight: 650; letter-spacing: -.03em; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 46px; }
    .pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
    .pw-toggle .i-eye-off { display: none; }
    .pw-toggle.on .i-eye { display: none; }
    .pw-toggle.on .i-eye-off { display: inline-block; }
    #errorMsg:empty { display: none; }
    @media (max-width: 480px) { .login-card { padding: 28px 22px 22px; } }
  </style>
</head>
<body>
  <!--ICON_SPRITE-->
  <main class="login-bg">
    <section class="card login-card">
      <div class="login-brand">
        <!--LOGO_MARK-->
        <div>
          <div class="wordmark">SubsTracker</div>
          <div class="eyebrow mt-1">订阅到期提醒 · 登录管理您的订阅</div>
        </div>
      </div>

      <form id="loginForm" class="grid gap-4" novalidate>
        <div>
          <label for="username" class="label">用户名</label>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>

        <div>
          <label for="password" class="label">密码</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <button type="button" class="icon-btn ghost sm pw-toggle" id="togglePassword" aria-label="显示 / 隐藏密码">
              <svg class="icon i-eye" aria-hidden="true"><use href="#i-eye"/></svg>
              <svg class="icon i-eye-off" aria-hidden="true"><use href="#i-eye-off"/></svg>
            </button>
          </div>
        </div>

        <div id="errorMsg" class="banner banner-danger" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block mt-1">
          <svg class="icon" aria-hidden="true"><use href="#i-log-in"/></svg>登录
        </button>
      </form>

      <p class="hint text-center mt-6">
        若仍使用默认账号 <code>admin</code> / <code>password</code>，登录后请立即在「系统配置」修改密码。
      </p>
    </section>
  </main>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      var p = document.getElementById('password');
      var show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      this.classList.toggle('on', show);
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';

      const button = e.target.querySelector('button[type="submit"]');
      const originalContent = button.innerHTML;
      button.innerHTML = '<svg class="icon spin" aria-hidden="true"><use href="#i-loader"/></svg>登录中...';
      button.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          window.location.href = '/admin';
        } else {
          errorEl.textContent = result.message || '用户名或密码错误';
          button.innerHTML = originalContent;
          button.disabled = false;
        }
      } catch (error) {
        errorEl.textContent = '发生错误，请稍后再试';
        button.innerHTML = originalContent;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
