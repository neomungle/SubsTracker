<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 · SubsTracker</title>
  ${themeResources}
  <style>
    .dash-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .dash-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
    .dash-card { padding: 20px 22px; min-width: 0; }
    .dash-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .dash-card-head h2 { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }
    .dash-card-head h2 .icon { color: var(--muted); }
    .trend { display: inline-flex; align-items: center; gap: 3px; margin-top: 8px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; width: max-content; }
    .trend .icon { width: 12px; height: 12px; }
    .trend.up { color: var(--red); background: var(--redBg); }
    .trend.down { color: var(--green); background: var(--greenBg); }
    .trend.flat { color: var(--muted); background: var(--card2); }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); }
    .list-row:first-child { border-top: 0; padding-top: 2px; }
    .list-row .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .list-row .amt { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .bar-row { margin-top: 14px; }
    .bar-row:first-child { margin-top: 0; }
    .bar-row .bar-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 6px; }
    .bar-row .bar-head .v { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
    .bar-row .bar-head .v b { color: var(--ink); font-weight: 600; margin-right: 6px; }
    .chartbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
    .chartbar > i { display: block; height: 100%; border-radius: 99px; background: var(--ink); transition: width .5s ease; }
    .donut-wrap { display: flex; align-items: center; gap: 26px; }
    .donut { width: 148px; height: 148px; border-radius: 50%; position: relative; flex-shrink: 0; }
    .donut::after { content: ''; position: absolute; inset: 26px; border-radius: 50%; background: var(--card); }
    .donut-legend { display: grid; gap: 9px; min-width: 0; flex: 1; }
    .donut-legend .lg { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
    .donut-legend .lg .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .donut-legend .lg .p { color: var(--muted); font-variant-numeric: tabular-nums; }
    .mini-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .mini-stat { padding: 12px 14px; }
    .mini-stat .k { color: var(--muted); font-size: 12px; }
    .mini-stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .hist-row { display: flex; gap: 12px; padding: 9px 2px; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
    .hist-row:first-child { border-top: 0; }
    .hist-row .when { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
    .hist-row .why { color: var(--muted); font-size: 12px; min-width: 0; word-break: break-word; }
    @media (max-width: 1023px) {
      .dash-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dash-grid-2 { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 560px) {
      .mini-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .donut-wrap { flex-direction: column; align-items: stretch; }
      .donut { margin: 0 auto; }
      .dash-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <!--ICON_SPRITE-->
  <!--APP_HEADER:dashboard-->

  <main class="main">
    <div class="page-head">
      <div>
        <div id="todayLabel" class="eyebrow">&nbsp;</div>
        <h1 class="page-title">仪表盘</h1>
        <p class="page-sub">订阅费用和活动概览（统计金额已折合为 CNY）</p>
      </div>
      <button id="refreshBtn" type="button" onclick="manualRefresh()" class="btn">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>刷新
      </button>
    </div>

    <section id="statsGrid" class="dash-grid-4" aria-label="数据概览">
      <div class="loading-skeleton"></div>
      <div class="loading-skeleton"></div>
      <div class="loading-skeleton"></div>
      <div class="loading-skeleton"></div>
    </section>

    <div class="dash-grid-2">
      <section class="card dash-card">
        <div class="dash-card-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>即将续费</h2>
          <a href="/admin" class="eyebrow inline-flex items-center gap-1">未来 7 天 · 查看全部<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
        </div>
        <div id="upcomingRenewals"><div class="loading-skeleton"></div></div>
      </section>

      <section class="card dash-card">
        <div class="dash-card-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-calendar-check"/></svg>最近支付</h2>
          <span class="badge">过去 7 天</span>
        </div>
        <div id="recentPayments"><div class="loading-skeleton"></div></div>
      </section>
    </div>

    <div class="dash-grid-2">
      <section class="card dash-card">
        <div class="dash-card-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-chart-bar"/></svg>按类型支出排行</h2>
          <span class="badge">年度 · 折合 CNY</span>
        </div>
        <div id="expenseByType"><div class="loading-skeleton"></div></div>
      </section>

      <section class="card dash-card">
        <div class="dash-card-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-chart-pie"/></svg>按分类支出</h2>
          <span class="badge">年度 · 折合 CNY</span>
        </div>
        <div id="expenseByCategory"><div class="loading-skeleton"></div></div>
      </section>
    </div>

    <section class="card dash-card mt-5">
      <div class="dash-card-head">
        <h2><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg>自动提醒任务状态</h2>
        <span class="badge">Cron 可观测性</span>
      </div>
      <div id="schedulerStatus"><div class="loading-skeleton"></div></div>
      <h3 class="font-semibold text-sm mt-6 mb-2">最近 10 次任务</h3>
      <div id="schedulerStatusHistory"><div class="loading-skeleton"></div></div>
    </section>
  </main>

  <script>
    // 统一 API 请求封装：401 自动跳转登录页
    async function apiFetch(url, options) {
      const response = await fetch(url, options);
      if (response.status === 401) {
        window.location.href = '/';
        throw new Error('AUTH_EXPIRED');
      }
      return response;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function ic(name, cls) {
      return '<svg class="icon' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
    }

    // 定义货币符号映射
    const currencySymbols = {
      'CNY': '¥', 'USD': '$', 'HKD': 'HK$', 'TWD': 'NT$',
      'JPY': '¥', 'EUR': '€', 'GBP': '£', 'KRW': '₩', 'TRY': '₺'
    };
    function getSymbol(currency) {
      return currencySymbols[currency] || '¥';
    }
    function money(n, symbol) {
      const v = Number(n) || 0;
      return (symbol || '¥') + v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const PALETTE = ['var(--ink)', 'var(--green)', 'var(--amber)', 'var(--blue)', 'var(--red)', 'var(--tertiary)'];

    function emptyState(iconName, text) {
      return '<div class="empty">' + ic(iconName) + '<div class="text-sm">' + text + '</div></div>';
    }

    // 前端统一本地时区显示
    async function showSystemTime() {
      try {
        const localTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

        function formatTimezoneDisplay(tz) {
          try {
            const now = new Date();
            const dtf = new Intl.DateTimeFormat('en-US', {
              timeZone: tz,
              hour12: false,
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            const parts = dtf.formatToParts(now);
            const get = type => Number(parts.find(x => x.type === type).value);
            const target = Date.UTC(get('year'), get('month') - 1, get('day'), get('hour'), get('minute'), get('second'));
            const utc = now.getTime();
            const offset = Math.round((target - utc) / (1000 * 60 * 60));
            const offsetStr = offset >= 0 ? '+' + offset : offset;
            return `${tz} (UTC${offsetStr})`;
          } catch (error) {
            console.error('格式化时区显示失败:', error);
            return tz;
          }
        }

        function update() {
          const now = new Date();
          const timeStr = now.toLocaleString('zh-CN', {
            timeZone: localTimezone,
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          });
          const tzStr = formatTimezoneDisplay(localTimezone);
          const el = document.getElementById('systemTimeDisplay');
          if (el) {
            el.textContent = `${timeStr}  ${tzStr}`;
          }
          const today = document.getElementById('todayLabel');
          if (today) {
            today.textContent = now.toLocaleDateString('zh-CN', { timeZone: localTimezone, weekday: 'long', month: 'long', day: 'numeric' });
          }
        }

        update();
        setInterval(update, 1000);
      } catch (e) {
        console.error(e);
      }
    }

    function renderBars(items, labelKey) {
      const max = Math.max.apply(null, items.map(i => Number(i.percentage) || 0).concat([1]));
      return items.map((item, i) => `
        <div class="bar-row">
          <div class="bar-head">
            <span class="truncate">${escapeHtml(item[labelKey])}</span>
            <span class="v"><b>${money(item.amount)}</b>${item.percentage}%</span>
          </div>
          <div class="chartbar"><i style="width:${Math.max(2, (Number(item.percentage) || 0) / max * 100)}%;background:${PALETTE[i % PALETTE.length]}"></i></div>
        </div>
      `).join('');
    }

    function renderDonut(items, labelKey) {
      let acc = 0;
      const top = items.slice(0, 6);
      const stops = top.map((item, i) => {
        const p = Number(item.percentage) || 0;
        const from = acc; acc += p;
        return PALETTE[i % PALETTE.length] + ' ' + from + '% ' + acc + '%';
      });
      if (acc < 100) stops.push('var(--line) ' + acc + '% 100%');
      return `
        <div class="donut-wrap">
          <div class="donut" style="background:conic-gradient(${stops.join(',')})" role="img" aria-label="按分类支出占比"></div>
          <div class="donut-legend">
            ${top.map((item, i) => `
              <div class="lg"><span class="stat-dot" style="background:${PALETTE[i % PALETTE.length]}"></span><span class="n">${escapeHtml(item[labelKey])}</span><span class="p">${money(item.amount)} · ${item.percentage}%</span></div>
            `).join('')}
          </div>
        </div>`;
    }

    async function loadDashboardData(){
      try {
        const r=await apiFetch('/api/dashboard/stats');
        const d=await r.json();
        if(!d.success) throw new Error(d.message||'加载失败');

        const data=d.data;

        const schedulerStatusEl = document.getElementById('schedulerStatus');
        if (schedulerStatusEl) {
          const status = data.schedulerStatus;
          if (!status) {
            schedulerStatusEl.innerHTML = emptyState('clock', '暂无定时任务执行记录（等待下一次 Cron）');
          } else {
            const sendResult = status.sendResult || {};
            const runAt = status.lastRunAt ? new Date(status.lastRunAt).toLocaleString('zh-CN') : '未知';
            const configuredHours = Array.isArray(status.configuredHours) && status.configuredHours.length > 0
              ? status.configuredHours.join(', ')
              : '全部时段';
            const sentBadge = status.sent
              ? '<span class="badge badge-ok badge-dot">本次有发送</span>'
              : '<span class="badge badge-soon badge-dot">本次未发送</span>';

            schedulerStatusEl.innerHTML = `
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-4 text-sm">
                ${sentBadge}
                <span class="eyebrow">最近执行 <span class="mono" style="color:var(--ink)">${escapeHtml(runAt)}</span></span>
                <span class="eyebrow">当前小时 / 配置时段：<span style="color:var(--ink)">${escapeHtml(status.currentHour || '--')} / ${escapeHtml(configuredHours)}</span></span>
              </div>
              <div class="mini-stats">
                <div class="panel mini-stat"><div class="k">检查</div><div class="v">${status.checkedSubscriptions || 0}</div></div>
                <div class="panel mini-stat"><div class="k">命中</div><div class="v">${status.expiringMatched || 0}</div></div>
                <div class="panel mini-stat"><div class="k">去重跳过</div><div class="v">${status.dedupeSkipped || 0}</div></div>
                <div class="panel mini-stat"><div class="k">发送成功 / 尝试</div><div class="v">${sendResult.successCount || 0}<span class="eyebrow" style="font-size:13px"> / ${sendResult.attempted || 0}</span></div></div>
              </div>
              <p class="hint">发送失败 ${sendResult.failedCount || 0} 个渠道 · ${escapeHtml(status.reason || '暂无详情')}</p>
            `;
          }
        }

        const schedulerHistory = Array.isArray(data.schedulerStatusHistory) ? data.schedulerStatusHistory : [];
        const schedulerHistoryEl = document.getElementById('schedulerStatusHistory');
        if (schedulerHistoryEl) {
          if (schedulerHistory.length === 0) {
            schedulerHistoryEl.innerHTML = '<div class="eyebrow py-2">暂无历史记录</div>';
          } else {
            schedulerHistoryEl.innerHTML = schedulerHistory.slice(0, 10).map(item => {
              const when = item.lastRunAt ? new Date(item.lastRunAt).toLocaleString('zh-CN') : '未知时间';
              const sent = item.sent ? '<span class="badge badge-ok">已发送</span>' : '<span class="badge">未发送</span>';
              const reason = item.reason || '-';
              return `<div class="hist-row"><span class="when">${escapeHtml(when)}</span>${sent}<span class="why">${escapeHtml(reason)}</span></div>`;
            }).join('');
          }
        }

        const trendDir = data.monthlyExpense.trendDirection;
        const trendIcon = trendDir === 'up' ? 'arrow-up' : trendDir === 'down' ? 'arrow-down' : 'arrow-right';
        const est = data.estimatedAnnualSpend || null;
        const exp = data.expiryStats || null;
        document.getElementById('statsGrid').innerHTML=`
          <div class="card stat">
            <span class="stat-label">本月支出</span>
            <strong class="stat-value">${money(data.monthlyExpense.amount)}</strong>
            <span class="trend ${escapeHtml(trendDir)}" title="与上月相比">${ic(trendIcon)}${data.monthlyExpense.trend}% 较上月</span>
          </div>
          <div class="card stat">
            <span class="stat-label">年度支出</span>
            <strong class="stat-value">${money(data.yearlyExpense.amount)}</strong>
            <small class="stat-sub">月均 ${money(data.yearlyExpense.monthlyAverage)}</small>
          </div>
          <div class="card stat">
            <span class="stat-label">年度预计支出</span>
            <strong class="stat-value">${est ? money(est.amount, getSymbol(est.currency)) : '—'}</strong>
            <small class="stat-sub">${est ? '按周期折算 · 月均 ' + money(est.monthly, getSymbol(est.currency)) : '暂无数据'}</small>
          </div>
          <div class="card stat">
            <span class="stat-label">活跃订阅</span>
            <strong class="stat-value">${data.activeSubscriptions.active}<span class="eyebrow" style="font-size:14px;font-weight:500"> / ${data.activeSubscriptions.total}</span></strong>
            <small class="stat-sub">${exp
              ? '<span style="color:var(--red)">已过期 ' + exp.expired + '</span> · <span style="color:var(--amber)">7 天内 ' + exp.expiringIn7Days + '</span> · 30 天内 ' + exp.expiringIn30Days
              : (data.activeSubscriptions.expiringSoon > 0 ? data.activeSubscriptions.expiringSoon + ' 项即将到期' : '暂无即将到期')}</small>
          </div>
        `;

        const rp=document.getElementById('recentPayments');
        rp.innerHTML=data.recentPayments.length===0?emptyState('calendar-check','过去 7 天内没有支付记录'):
        data.recentPayments.map(s=>`
          <div class="list-row">
            <div class="min-w-0">
              <div class="name">${escapeHtml(s.name)}</div>
              <div class="meta">
                <span class="mono">${new Date(s.paymentDate).toLocaleDateString('zh-CN')}</span>
                ${s.customType?`<span class="badge">${escapeHtml(s.customType)}</span>`:''}
              </div>
            </div>
            <div class="amt">${getSymbol(s.currency)}${(s.amount||0).toFixed(2)}</div>
          </div>
        `).join('');

        const ur=document.getElementById('upcomingRenewals');
        ur.innerHTML=data.upcomingRenewals.length===0?emptyState('check-circle','未来 7 天内没有即将续费的订阅'):
        data.upcomingRenewals.map(s=>`
          <div class="list-row">
            <div class="min-w-0">
              <div class="name">${escapeHtml(s.name)}</div>
              <div class="meta">
                <span class="mono">${new Date(s.renewalDate).toLocaleDateString('zh-CN')}</span>
                ${s.customType?`<span class="badge">${escapeHtml(s.customType)}</span>`:''}
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="badge ${Number(s.daysUntilRenewal) <= 3 ? 'badge-over' : 'badge-soon'}">${s.daysUntilRenewal} 天后</span>
              <div class="amt">${getSymbol(s.currency)}${(s.amount||0).toFixed(2)}</div>
            </div>
          </div>
        `).join('');

        const et=document.getElementById('expenseByType');
        et.innerHTML=data.expenseByType.length===0?emptyState('chart-bar','暂无支出数据'):renderBars(data.expenseByType, 'type');

        const ec=document.getElementById('expenseByCategory');
        ec.innerHTML=data.expenseByCategory.length===0?emptyState('chart-pie','暂无支出数据'):renderDonut(data.expenseByCategory, 'category');
      } catch(e){
        if (e && e.message === 'AUTH_EXPIRED') return;
        console.error('加载仪表盘数据失败:',e);
        document.getElementById('statsGrid').innerHTML='<div class="card empty" style="grid-column:1/-1">' + ic('alert-circle') + '<div class="text-sm">加载失败: '+escapeHtml(e.message||'网络错误')+'</div><button type="button" onclick="manualRefresh()" class="btn btn-sm mt-3">' + ic('rotate-cw') + '重试</button></div>';
      }
    }

    // 手动刷新
    async function manualRefresh() {
      const btn = document.getElementById('refreshBtn');
      btn.innerHTML = ic('loader', 'spin') + '刷新中';
      btn.disabled = true;
      await loadDashboardData();
      btn.innerHTML = ic('refresh') + '刷新';
      btn.disabled = false;
    }
    window.manualRefresh = manualRefresh;

    // 初始化时间显示和数据加载
    showSystemTime();
    loadDashboardData();

    // 自动刷新：页面可见时每 60 秒刷新，不可见时暂停
    let refreshTimer = setInterval(loadDashboardData, 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      } else {
        loadDashboardData();
        refreshTimer = setInterval(loadDashboardData, 60000);
      }
    });
  </script>
</body>
</html>
